# Publica la web en el servidor de IONOS (1&1) por SFTP cada vez que se sube un cambio a main.
#
# Configurar en GitHub → Settings → Secrets and variables → Actions:
#   SFTP_HOST      p. ej. access-XXXXXXX.webspace-host.com
#   SFTP_USER      usuario SFTP de IONOS
#   SFTP_PASSWORD  contraseña SFTP
#   SFTP_PATH      carpeta de destino en el servidor, p. ej. /mhrhotels-web
#
# Mientras no estén configurados, el workflow solo compila la web.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir a IONOS por SFTP
        if: ${{ env.SFTP_HOST != '' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Comprobaciones de formato (no muestran la contraseña)
          check() { case "$2" in " "*|*" ") echo "AVISO: $1 tiene espacios al principio o al final";; esac; }
          check SFTP_HOST "$SFTP_HOST"; check SFTP_USER "$SFTP_USER"; check SFTP_PASSWORD "$SFTP_PASSWORD"; check SFTP_PATH "$SFTP_PATH"
          case "$SFTP_HOST" in *://*|*/*|*:*) echo "AVISO: SFTP_HOST debe ser solo el nombre del servidor, sin sftp:// ni puerto";; esac
          case "$SFTP_USER" in *@*) echo "AVISO: SFTP_USER parece un email; debe ser el usuario SFTP de IONOS";; esac
          echo "Longitud del usuario: ${#SFTP_USER} caracteres"
          echo "Servidor responde en el puerto 22:"; timeout 10 bash -c "head -c 40 < /dev/tcp/$SFTP_HOST/22" || echo "  no responde"
          echo
          # La contraseña se pasa por variable de entorno para que no la rompan comas o símbolos
          export LFTP_PASSWORD="$SFTP_PASSWORD"
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST:22" -e "
            set sftp:auto-confirm yes;
            debug 3;
            mirror --reverse --delete --verbose --exclude-glob api/config.php --exclude-glob api/errores.log dist/ '$SFTP_PATH';
            bye"
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
